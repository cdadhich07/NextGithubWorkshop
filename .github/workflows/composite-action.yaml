name: composite workflow
on:
  push:
    branches: [main]

jobs:
  first:
    runs-on: ubuntu-latest
    steps:
    - name: checkout code
      uses: actions/checkout@v6
    - name: setup python
      uses: ./.github/actions/setup-python-env
      with:
        python-version: '3.11'
        requirements-path: 'requirements.txt'